name: Update Lumina wallpaper manifest

on:
  push:
    branches:
      - main
    paths:
      - "*.jpg"
      - "*.jpeg"
      - "*.png"
      - "*.webp"
      - "*.gif"
      - "*.bmp"
      - "**/*.jpg"
      - "**/*.jpeg"
      - "**/*.png"
      - "**/*.webp"
      - "**/*.gif"
      - "**/*.bmp"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-manifest:
    runs-on: ubuntu-latest
    steps:
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Regenerate the remote Lumina catalogue
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_SHA: ${{ github.sha }}
        run: |
          node --input-type=module <<'NODE'
          const repo = process.env.GITHUB_REPOSITORY;
          const token = process.env.GITHUB_TOKEN;
          const commitSha = process.env.GITHUB_SHA;
          const api = `https://api.github.com/repos/${repo}`;
          const headers = {
            Accept: "application/vnd.github+json",
            Authorization: `Bearer ${token}`,
            "X-GitHub-Api-Version": "2022-11-28",
          };

          async function github(path, options = {}) {
            const response = await fetch(`${api}${path}`, {
              ...options,
              headers: { ...headers, ...(options.headers || {}) },
            });
            if (!response.ok) {
              throw new Error(`GitHub API ${response.status}: ${await response.text()}`);
            }
            return response.json();
          }

          const commit = await github(`/commits/${commitSha}`);
          const tree = await github(`/git/trees/${commit.commit.tree.sha}?recursive=1`);
          if (tree.truncated) {
            throw new Error("GitHub truncated the wallpaper tree; refusing to publish an incomplete catalogue.");
          }

          const supported = new Set(["jpg", "jpeg", "png", "webp", "gif", "bmp"]);
          const files = tree.tree
            .filter((entry) => {
              if (entry.type !== "blob") return false;
              const extension = entry.path.split(".").pop()?.toLowerCase();
              return supported.has(extension);
            })
            .sort((a, b) => a.path.localeCompare(b.path, undefined, { numeric: true }));

          const wallpapers = files.map((file, index) => {
            const encodedPath = file.path.split("/").map(encodeURIComponent).join("/");
            const fullUrl = `https://raw.githubusercontent.com/${repo}/main/${encodedPath}`;
            const id = file.path.replace(/[^a-zA-Z0-9_-]/g, "-").replace(/-+/g, "-").replace(/^-|-$/g, "");
            return {
              id,
              title: `Wallpaper ${String(index + 1).padStart(3, "0")}`,
              category: "Collection",
              filename: file.path,
              format: file.path.split(".").pop().toLowerCase(),
              bytes: file.size,
              fullUrl,
              thumbnailUrl: `https://wsrv.nl/?url=${encodeURIComponent(fullUrl)}&w=480&output=webp&q=78`,
            };
          });

          const manifest = {
            schemaVersion: 1,
            generatedAt: new Date().toISOString(),
            source: { repository: repo, branch: "main" },
            count: wallpapers.length,
            thumbnailService: "wsrv.nl",
            wallpapers,
          };
          const body = JSON.stringify(manifest, null, 2) + "\n";
          const current = await github("/contents/lumina/catalog.json?ref=lumina-catalog");
          await github("/contents/lumina/catalog.json", {
            method: "PUT",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              message: `chore(lumina): refresh catalogue (${wallpapers.length} wallpapers)`,
              content: Buffer.from(body, "utf8").toString("base64"),
              sha: current.sha,
              branch: "lumina-catalog",
            }),
          });

          console.log(`Updated lumina-catalog/lumina/catalog.json with ${wallpapers.length} images.`);
          NODE
